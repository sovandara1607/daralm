[project]
name = "daralm"
version = "0.1.0"
description = "DaraLM — a from-scratch decoder-only Transformer LLM for Khmer + English, built as an educational/portfolio project."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "srith" }]

dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "torch>=2.4,<3",
    "numpy>=1.26,<3",
    "datasets>=2.19,<4",
    "sentencepiece>=0.2,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "prometheus-client>=0.20,<1",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

# Use CPU-only PyTorch wheels in the Linux container.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only used for packages that opt in via tool.uv.sources above

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daralm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency defaults intentionally use Depends().
"api/routes/*.py" = ["B008"]
