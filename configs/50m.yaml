
model_name: daralm-50m
tags: ["50m"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000  # matches the shared DaraLM tokenizer trained in Phase 2 (see note below)
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.1
  gradient_clip: 1.0
  batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 1500
  warmup_steps: 20
  eval_interval: 50
  save_interval: 150
  log_interval: 10
  seed: 42
  compile: true  # measured 1.43x MPS / 1.24x CPU step-time speedup at this scale — Model Optimization Stage 3
