model_name: daralm-10m
tags: ["10m"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000  # matches the shared DaraLM tokenizer trained in Phase 2
  hidden_size: 288
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1152   # 4x hidden_size, standard GPT-style ratio
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.1
  gradient_clip: 1.0
  batch_size: 8
  gradient_accumulation_steps: 2
  max_steps: 600
  warmup_steps: 30
  eval_interval: 60
  save_interval: 300
  log_interval: 15
  seed: 42
