# DaraLM-Tiny — debug model.
#
# Purpose: verify the entire pipeline (config -> data -> tokenizer ->
# model -> training -> checkpoint -> generation) quickly and cheaply
# before spending real compute on DaraLM-10M / DaraLM-50M. See spec
# section 17 ("DEBUG MODEL") and section 19 ("SANITY TEST").

model_name: daralm-tiny
tags: ["debug", "tiny"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000         # matches the shared DaraLM tokenizer trained in Phase 2
  hidden_size: 128
  num_layers: 2
  num_attention_heads: 4
  intermediate_size: 512    # 4x hidden_size, standard GPT-style ratio
  max_position_embeddings: 256
  dropout: 0.1

training:
  precision: fp32
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0
  batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 300
  warmup_steps: 30
  eval_interval: 50
  save_interval: 100
  log_interval: 10
  seed: 42
