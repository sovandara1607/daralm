# DaraLM-50M-Instruct — supervised fine-tune of DaraLM-50M Base (Phase 9).
#
# `architecture` is a byte-for-byte copy of configs/50m.yaml. It has to be:
# scripts/train_sft.py loads the Base checkpoint's weights into a freshly
# constructed model built from *this* config, and any architecture mismatch
# (different hidden_size, vocab_size, etc.) would make `load_state_dict`
# fail loudly — which is the point, but there's no reason to court it.
# Only `training` differs, and `model_name` so checkpoints land in their own
# `checkpoints/daralm-50m-instruct/` directory, never overwriting Base.

model_name: daralm-50m-instruct
tags: ["50m", "instruct", "sft"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  # SFT uses a much lower LR than pretraining (3e-4) — the model already
  # has real language ability from Base; SFT should nudge it toward
  # following the instruction/response format, not relearn from scratch.
  # A pretrain-sized LR on a ~300-example dataset would overfit or
  # destroy Base's learned weights within a handful of steps.
  learning_rate: 0.00005
  weight_decay: 0.1
  gradient_clip: 1.0
  # batch_size=4 reuses the exact shape Phase 6-7 proved safe on this
  # hardware's MPS backend. Instruction examples are padded to
  # block_size=768 (see scripts/train_sft.py) as of the dataset expansion
  # below — re-measured (not assumed) safe at this shape too, and it's a
  # DIFFERENT failure mode than the earlier throughput cliffs, not just a
  # repeat: batch=4 -> 0.510s/step, batch=8 -> 1.379s/step (a real but mild
  # ~2.7x slowdown for 2x the data, not a cliff), batch=16 -> crashed
  # outright with "MPS backend out of memory" (17.54 GiB allocated) rather
  # than merely running slow. batch_size=4 stays the safety-margined choice.
  batch_size: 4
  gradient_accumulation_steps: 4
  # Dataset expanded from 275 to 784 train examples after finding a real
  # Khmer instruction dataset (saillab/alpaca_khmer_taco) instead of
  # relying on 25 hand-authored examples alone (see
  # scripts/prepare_instruction_dataset.py). 784 / effective batch 16 =
  # 49 steps/epoch; 300 steps ~= 6 epochs, matching the same epoch count
  # the original 100-step run used on the smaller dataset, scaled up.
  max_steps: 300
  warmup_steps: 30
  eval_interval: 50
  save_interval: 100
  log_interval: 10
  seed: 42
