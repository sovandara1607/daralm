
model_name: daralm-150m
tags: ["150m"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000
  hidden_size: 896
  num_layers: 14
  num_attention_heads: 14
  intermediate_size: 3584
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 0.1
  gradient_clip: 1.0
  batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 6000
  warmup_steps: 20
  eval_interval: 250
  save_interval: 500
  log_interval: 25
  seed: 42
