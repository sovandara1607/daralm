
model_name: daralm-150m
tags: ["150m"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000
  hidden_size: 896
  num_layers: 14
  num_attention_heads: 14
  intermediate_size: 3584
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 0.1
  gradient_clip: 1.0
  batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 6000
  warmup_steps: 20
  eval_interval: 250
  save_interval: 500
  log_interval: 25
  seed: 42
  # Measured 1.04x on MPS at this model's own batch_size=2/seq_len=1024 (i.e. within
  # noise, not the 1.43x seen at 50m scale — don't assume the 50m result transfers).
  # Left on: no measured regression either, and it may help more at a larger batch
  # size or on the CPU/fbgemm deployment target, neither checked here.
  compile: true
