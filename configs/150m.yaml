# DaraLM-150M — the scale-up target after DaraLM-50M's real-world lesson:
# hallucination at 50M's scale is a data/parameter-count ceiling, not a bug
# to fine-tune away. This config is a genuine step up in both directions
# at once (bigger model + bigger corpus, see scripts/prepare_dataset.py's
# --docs-per-language), not just a bigger number in one field.
#
# vocab_size stays 16,000 — the existing Phase 2 tokenizer, not retrained
# this round. Scaling the corpus and the model are the two variables this
# round is actually testing; changing the tokenizer too would confound
# which change caused which effect, and would invalidate every existing
# checkpoint's embeddings for a decision that wasn't asked for this round.

model_name: daralm-150m
tags: ["150m"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000
  hidden_size: 896
  num_layers: 14
  num_attention_heads: 14
  intermediate_size: 3584
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 0.1
  gradient_clip: 1.0
  # An isolated benchmark first measured 42.5s/step here and that number
  # got reported and even written into this comment as fact — it was
  # wrong. The isolated script was contaminated by leftover zombie
  # processes competing for MPS resources; the *actual* first 300-step
  # training run, moments later, ran at a steady ~1.1-1.2s/step. Correction
  # made in real time once the real run's speed was visible, not smoothed
  # over afterward — see README's "DaraLM-150M: the scale-up experiment"
  # section for the full story, including the second real cost that
  # wasn't in the original estimate either: validation passes took ~4.3
  # min each (the val set grew 3x with the corpus), and with
  # eval_interval=25 firing 12 times across 300 steps, validation — not
  # training — dominated that run's real ~53-minute total wall-clock.
  #
  # gradient_accumulation_steps=1 (effective batch=2, noisier than every
  # smaller model's effective batch=16) was a deliberate tradeoff under
  # the original (wrong) time pressure — kept for this continuation too,
  # for consistency with the already-trained first 300 steps' optimizer
  # trajectory, not re-litigated just because the time pressure that
  # motivated it turned out to be based on a bad number.
  batch_size: 2
  gradient_accumulation_steps: 1
  # First 300 steps (perplexity 3338.8 -> 1131.5) left this model behind
  # DaraLM-50M's own step-300 result (573.6) and having seen only ~2% of
  # the corpus — nowhere near the point where 150M's extra capacity should
  # start paying off. Extended 300 -> 6000 (20x, a bigger jump than 50M's
  # own 5x extension, since 150M needs proportionally more steps to see
  # the same token count at half 50M's batch size) to actually reach
  # toward that crossover point rather than stopping right where the
  # model looked worst. eval_interval widened 25->250 specifically because
  # validation dominated the first run's wall-clock — at the old cadence,
  # 6000 steps would mean ~24 hours of validation alone (240 passes x
  # 4.3min), not the real work. Real estimate at the new cadence: ~110 min
  # training + ~100 min validation (23 more passes) =~ 3.5 hours total.
  max_steps: 6000
  warmup_steps: 20
  eval_interval: 250
  save_interval: 500
  log_interval: 25
  seed: 42
