# DaraLM-50M-Grammar — supervised fine-tune of DaraLM-50M Base on synthetic
# grammar/spelling correction (Stage 2, item 3 of ROADMAP_NLP_PLATFORM.md).
#
# `architecture` is a byte-for-byte copy of configs/50m.yaml, same reason as
# configs/50m-instruct.yaml: scripts/train_sft.py loads Base's weights into
# a freshly constructed model built from *this* config, so any architecture
# mismatch would make load_state_dict fail loudly.
#
# Data: data/grammar/instructions_{train,val,test}.jsonl, built by
# scripts/prepare_grammar_dataset.py — synthetic (corrupted, clean) pairs
# from this project's own corpus, no external dataset.

model_name: daralm-50m-grammar
tags: ["50m", "grammar", "sft"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  # Same low-LR reasoning as 50m-instruct.yaml: Base already has real
  # language ability, SFT should nudge it toward this new task's format,
  # not relearn from scratch on a comparatively small dataset.
  learning_rate: 0.00005
  weight_decay: 0.1
  gradient_clip: 1.0
  # batch_size=4 reuses the exact shape already measured safe on this
  # hardware for instruction-length examples (configs/50m-instruct.yaml) —
  # grammar examples are shorter (single sentences vs multi-turn
  # instructions), so this is a safety margin, not a re-measurement.
  batch_size: 4
  gradient_accumulation_steps: 4
  # 3000 train examples / effective batch 16 = 187 steps/epoch; 400 steps
  # is a bit over 2 epochs — enough to see a real trend without assuming
  # more epochs are needed before ever checking.
  max_steps: 400
  warmup_steps: 40
  eval_interval: 50
  save_interval: 100
  log_interval: 10
  seed: 42
