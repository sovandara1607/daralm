
model_name: daralm-50m-corpus-qa
tags: ["50m", "corpus-qa", "sft", "closed-book"]

architecture:
  type: decoder_only_transformer
  vocab_size: 16000
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 1024
  dropout: 0.1

training:
  precision: bf16
  optimizer: adamw
  learning_rate: 0.00005
  weight_decay: 0.1
  gradient_clip: 1.0
  batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 1400
  warmup_steps: 60
  eval_interval: 150
  save_interval: 350
  log_interval: 20
  seed: 42
